[pytest]
log_cli = true
log_cli_level = INFO
log_cli_format = %(message)s

addopts =
    -v
    -s
    --html=reports/report.html
    --self-contained-html

testpaths = tests

python_files = TC_*.py
python_functions = test_*

markers =
    s3: S3 integration automation tests
    files: Files module automation tests
    datasets: Datasets module automation tests
    templates: Templates module automation tests
    workflows: Workflows module automation tests
    users: Users module automation tests
    projects: Projects module automation tests
    restrictions: Restriction validation regression tests
    common: Common module automation tests
    annotator: Annotator module automation tests
    reviewer: Reviewer module tests
    regression: End to end regression tests
    smoke: Smoke tests for critical path verification