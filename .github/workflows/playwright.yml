name: Playwright Automation Tests (Jenkins-Style)

on:
  workflow_dispatch:
    inputs:
      test_suite:
        description: "1️⃣ SELECT MODULE / SUITE"
        required: true
        default: "objectwaysSanity"
        type: choice
        options:
          - "objectwaysSanity"
          - "newCompanySanity"
          - "AnnotatorReviewer"
          - "datasets"
          - "files"
          - "projects"
          - "templates"
          - "users"
          - "workflows"
          - "all"

      execution_url:
        description: "2️⃣ TARGET URL [All Modules]"
        required: true
        default: "https://fmn-qa1.tensoract.com"
        type: choice
        options:
          - "https://fmn-qa.tensoract.com/"
          - "https://fmn-qa1.tensoract.com"
          - "https://fmn-staging.tensoract.com/"
        type: string

      company_username:
        description: "3️⃣ COMPANY ADMIN EMAIL [ObjectwaysSanity, AnnotatorReviewer & Other Modules]"
        required: false
        default: "admin@liceum.ai"
        type: string

      company_password:
        description: "4️⃣ COMPANY ADMIN PASSWORD [ObjectwaysSanity, AnnotatorReviewer & Other Modules]"
        required: false
        default: "Admin123!"
        type: string

      superuser_username:
        description: "5️⃣ SUPERUSER EMAIL [For newCompanySanity ONLY]"
        required: false
        default: ""
        type: string

      superuser_password:
        description: "6️⃣ SUPERUSER PASSWORD [For newCompanySanity ONLY]"
        required: false
        default: ""
        type: string

      annotator1_username:
        description: "7️⃣ ANNOTATOR 1 EMAIL [ObjectwaysSanity & AnnotatorReviewer ONLY]"
        required: false
        default: "annotator1@objectways.com"
        type: string

      annotator1_password:
        description: "8️⃣ ANNOTATOR 1 PASSWORD [ObjectwaysSanity & AnnotatorReviewer ONLY]"
        required: false
        default: "Annotator123!"
        type: string

      annotator2_username:
        description: "9️⃣ ANNOTATOR 2 EMAIL [ObjectwaysSanity & AnnotatorReviewer ONLY]"
        required: false
        default: "annotator2@objectways.com"
        type: string

      annotator2_password:
        description: "🔟 ANNOTATOR 2 PASSWORD [ObjectwaysSanity & AnnotatorReviewer ONLY]"
        required: false
        default: "Annotator123!"
        type: string

      reviewer1_username:
        description: "1️⃣1️⃣ REVIEWER 1 EMAIL [ObjectwaysSanity & AnnotatorReviewer ONLY]"
        required: false
        default: "reviewer@objectways.com"
        type: string

      reviewer1_password:
        description: "1️⃣2️⃣ REVIEWER 1 PASSWORD [ObjectwaysSanity & AnnotatorReviewer ONLY]"
        required: false
        default: "Reviewer123!"
        type: string

      different_email_for_otp:
        description: "1️⃣3️⃣ OTP EMAIL [ObjectwaysSanity & newCompanySanity ONLY]"
        required: false
        default: "worthy58@web-library.net"
        type: string

      different_email_for_otp_password:
        description: "1️⃣4️⃣ OTP EMAIL PASSWORD [ObjectwaysSanity & newCompanySanity ONLY]"
        required: false
        default: "$6y1q=(gLq"
        type: string

      company_name:
        description: "1️⃣5️⃣ COMPANY NAME [ObjectwaysSanity, AnnotatorReviewer & Other Modules]"
        required: false
        default: "Objectways"
        type: string

jobs:
  playwright-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java (for Allure Report CLI)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Allure CLI
        run: |
          npm install -g allure-commandline --save-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Create Environment File (.env)
        shell: bash
        run: |
          EXEC_URL="${{ inputs.execution_url }}"
          COMP_USER="${{ inputs.company_username }}"
          COMP_PASS="${{ inputs.company_password }}"
          SUPER_USER="${{ inputs.superuser_username }}"
          SUPER_PASS="${{ inputs.superuser_password }}"
          ANN1_USER="${{ inputs.annotator1_username }}"
          ANN1_PASS="${{ inputs.annotator1_password }}"
          ANN2_USER="${{ inputs.annotator2_username }}"
          ANN2_PASS="${{ inputs.annotator2_password }}"
          REV1_USER="${{ inputs.reviewer1_username }}"
          REV1_PASS="${{ inputs.reviewer1_password }}"
          OTP_EMAIL="${{ inputs.different_email_for_otp }}"
          OTP_PASS="${{ inputs.different_email_for_otp_password }}"
          COMP_NAME="${{ inputs.company_name }}"

          # If newCompanySanity selected and superuser credentials provided, use superuser as company_Username
          if [ "${{ inputs.test_suite }}" = "newCompanySanity" ] && [ -n "$SUPER_USER" ]; then
            COMP_USER="$SUPER_USER"
            COMP_PASS="$SUPER_PASS"
          fi

          cat <<EOF > .env
          QA_url_1="${EXEC_URL}"
          QA_url_2="${EXEC_URL}"
          QA_url_Staging="${EXEC_URL}"
          Execution_url="${EXEC_URL}"
          company_Username="${COMP_USER}"
          company_Password="${COMP_PASS}"
          annotator_Username="${ANN1_USER}"
          annotator_Password="${ANN1_PASS}"
          annotator_Username_2="${ANN2_USER}"
          annotator_Password_2="${ANN2_PASS}"
          reviewer_Username="${REV1_USER}"
          reviewer_Password="${REV1_PASS}"
          different_email_for_otp="${OTP_EMAIL}"
          different_email_for_otp_password="${OTP_PASS}"
          company_Name="${COMP_NAME}"
          EOF

      - name: Run Playwright Tests
        shell: bash
        env:
          HEADLESS: "true"
        run: |
          if [ "${{ inputs.test_suite }}" = "all" ]; then
            pytest tests/ --alluredir=allure-results
          else
            pytest "tests/${{ inputs.test_suite }}" --alluredir=allure-results
          fi

      - name: Generate Allure Report
        if: always()
        run: |
          allure generate allure-results --clean -o allure-report

      - name: Upload Allure Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ inputs.test_suite }}
          path: allure-report/
