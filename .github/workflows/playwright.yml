name: Playwright Automation Tests

permissions:
  contents: write
  pages: write
  id-token: write

env:
  ACTIONS_NODE20_DEPRECATION_WARNING: "false"
  MICROSOFT_CLIENT_ID: "${{ secrets.MICROSOFT_CLIENT_ID }}"
  MICROSOFT_CLIENT_SECRET: "${{ secrets.MICROSOFT_CLIENT_SECRET }}"
  MICROSOFT_OTP_EMAIL: "${{ secrets.MICROSOFT_OTP_EMAIL }}"
  MICROSOFT_TENANT_ID: "${{ secrets.MICROSOFT_TENANT_ID }}"
  different_email_for_otp: "${{ secrets.different_email_for_otp }}"

on:
  workflow_dispatch:
    inputs:

      # ============================================================
      # 1. MODULE SELECTION
      # ============================================================

      test_module:
        description: "1️⃣ SELECT MODULE"
        required: true
        default: "objectwaysSanity"
        type: choice
        options:
          - objectwaysSanity
          - newCompanySanity
          - AnnotatorReviewer
          - datasets
          - files
          - projects
          - templates
          - users
          - workflows
          - all
          - custom

      # ============================================================
      # 2. CUSTOM TEST PATH
      # ============================================================

      test_path:
        description: "2️⃣ CUSTOM TEST PATH / FILE / PATTERN / MULTIPLE MODULES (Optional)"
        required: false
        default: ""
        type: string

      # ============================================================
      # 3. TARGET URL
      # ============================================================

      execution_url:
        description: "3️⃣ TARGET URL"
        required: true
        default: "https://fmn-qa1.tensoract.com"
        type: choice
        options:
          - "https://fmn-qa.tensoract.com/"
          - "https://fmn-qa1.tensoract.com"
          - "https://fmn-staging.tensoract.com/"

      # ============================================================
      # 4. COMPANY ADMIN
      # ============================================================

      company_username:
        description: "4️⃣ COMPANY ADMIN EMAIL"
        required: false
        default: "admin@objectways.com"
        type: string

      company_password:
        description: "5️⃣ COMPANY ADMIN PASSWORD"
        required: false
        default: "Admin123!"
        type: string

      # ============================================================
      # 6. ANNOTATOR 1
      # ============================================================

      annotator1_username:
        description: "8️⃣ ANNOTATOR 1 EMAIL"
        required: false
        default: "annotator1@objectways.com"
        type: string

      annotator1_password:
        description: "9️⃣ ANNOTATOR 1 PASSWORD"
        required: false
        default: "Annotator123!"
        type: string

      # ============================================================
      # 7. ANNOTATOR 2
      # ============================================================

      annotator2_username:
        description: "🔟 ANNOTATOR 2 EMAIL"
        required: false
        default: "annotator2@objectways.com"
        type: string

      annotator2_password:
        description: "1️⃣1️⃣ ANNOTATOR 2 PASSWORD"
        required: false
        default: "Annotator123!"
        type: string

      # ============================================================
      # 8. REVIEWER
      # ============================================================

      reviewer1_username:
        description: "1️⃣2️⃣ REVIEWER 1 EMAIL"
        required: false
        default: "reviewer@objectways.com"
        type: string

      reviewer1_password:
        description: "1️⃣3️⃣ REVIEWER 1 PASSWORD"
        required: false
        default: "Reviewer123!"
        type: string

      # ============================================================
      # 10. COMPANY NAME
      # ============================================================

      company_name:
        description: "1️⃣6️⃣ COMPANY NAME"
        required: false
        default: "Objectways"
        type: string


jobs:

  playwright-tests:

    name: Playwright Tests

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # ============================================================
      # CHECKOUT REPOSITORY
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # SETUP PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # ============================================================
      # SETUP JAVA FOR ALLURE
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # INSTALL ALLURE CLI
      # ============================================================

      - name: Install Allure CLI
        run: |
          npm install -g allure-commandline

      # ============================================================
      # INSTALL PYTHON DEPENDENCIES
      # ============================================================

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # ============================================================
      # CREATE .ENV FILE
      # ============================================================

      - name: Create Environment File
        shell: bash
        env:
          MICROSOFT_CLIENT_ID: "${{ secrets.MICROSOFT_CLIENT_ID }}"
          MICROSOFT_CLIENT_SECRET: "${{ secrets.MICROSOFT_CLIENT_SECRET }}"
          MICROSOFT_OTP_EMAIL: "${{ secrets.MICROSOFT_OTP_EMAIL }}"
          MICROSOFT_TENANT_ID: "${{ secrets.MICROSOFT_TENANT_ID }}"
          different_email_for_otp: "${{ secrets.different_email_for_otp }}"
        run: |

          EXEC_URL="${{ inputs.execution_url }}"

          COMP_USER="${{ inputs.company_username }}"
          COMP_PASS="${{ inputs.company_password }}"

          ANN1_USER="${{ inputs.annotator1_username }}"
          ANN1_PASS="${{ inputs.annotator1_password }}"

          ANN2_USER="${{ inputs.annotator2_username }}"
          ANN2_PASS="${{ inputs.annotator2_password }}"

          REV1_USER="${{ inputs.reviewer1_username }}"
          REV1_PASS="${{ inputs.reviewer1_password }}"

          COMP_NAME="${{ inputs.company_name }}"

          MS_CLIENT_ID="${MICROSOFT_CLIENT_ID}"
          MS_CLIENT_SECRET="${MICROSOFT_CLIENT_SECRET}"
          MS_OTP_EMAIL="${MICROSOFT_OTP_EMAIL:-$different_email_for_otp}"
          MS_TENANT_ID="${MICROSOFT_TENANT_ID}"
          different_email="${different_email_for_otp:-$MICROSOFT_OTP_EMAIL}"

          cat << EOF | sed 's/^[ \t]*//' > .env
          QA_url_1="${EXEC_URL}"
          QA_url_2="${EXEC_URL}"
          QA_url_Staging="${EXEC_URL}"
          Execution_url="${EXEC_URL}"

          company_Username="${COMP_USER}"
          company_Password="${COMP_PASS}"

          annotator_Username="${ANN1_USER}"
          annotator_Password="${ANN1_PASS}"

          annotator_Username_2="${ANN2_USER}"
          annotator_Password_2="${ANN2_PASS}"

          reviewer_Username="${REV1_USER}"
          reviewer_Password="${REV1_PASS}"

          company_Name="${COMP_NAME}"

          MICROSOFT_CLIENT_ID="${MS_CLIENT_ID}"
          MICROSOFT_CLIENT_SECRET="${MS_CLIENT_SECRET}"
          MICROSOFT_OTP_EMAIL="${MS_OTP_EMAIL}"
          MICROSOFT_TENANT_ID="${MS_TENANT_ID}"
          different_email_for_otp="${different_email}"
          EOF

          echo "Environment file created successfully."

      # ============================================================
      # DETERMINE TEST PATH
      # ============================================================

      - name: Determine Tests To Run
        shell: bash
        env:
          TEST_MODULE: ${{ inputs.test_module }}
          CUSTOM_PATH: ${{ inputs.test_path }}
        run: |

          echo "=============================================="
          echo "TEST SELECTION"
          echo "=============================================="
          echo "Selected Module : $TEST_MODULE"
          echo "Custom Path     : $CUSTOM_PATH"
          echo "=============================================="

          if [ -n "$CUSTOM_PATH" ]; then
            echo "Custom test path provided."
            CUSTOM_PATH="${CUSTOM_PATH//\\//}"
            echo "$CUSTOM_PATH" > test_execution_path.txt
          elif [ "$TEST_MODULE" = "all" ]; then
            echo "Running ALL test modules."
            echo "tests" > test_execution_path.txt
          else
            echo "Running selected module."
            echo "tests/$TEST_MODULE" > test_execution_path.txt
          fi

          echo "Final Test Selection:"
          cat test_execution_path.txt
          echo "=============================================="

      # ============================================================
      # RUN PLAYWRIGHT TESTS
      # ============================================================

      - name: Run Playwright Tests
        id: pytest_step
        continue-on-error: true
        shell: bash
        env:
          HEADLESS: "true"
          MICROSOFT_CLIENT_ID: "${{ secrets.MICROSOFT_CLIENT_ID }}"
          MICROSOFT_CLIENT_SECRET: "${{ secrets.MICROSOFT_CLIENT_SECRET }}"
          MICROSOFT_OTP_EMAIL: "${{ secrets.MICROSOFT_OTP_EMAIL }}"
          MICROSOFT_TENANT_ID: "${{ secrets.MICROSOFT_TENANT_ID }}"
          different_email_for_otp: "${{ secrets.different_email_for_otp }}"
        run: |

          rm -rf allure-results allure-report
          mkdir -p allure-results allure-report

          TEST_SELECTION=$(cat test_execution_path.txt)

          echo "=============================================="
          echo "RUNNING TESTS"
          echo "=============================================="
          echo "Test Selection: $TEST_SELECTION"
          echo "=============================================="

          IFS=',' read -ra TEST_PATHS <<< "$TEST_SELECTION"
          PYTEST_ARGS=()

          for path in "${TEST_PATHS[@]}"; do
            path=$(echo "$path" | xargs)
            if [ -z "$path" ]; then
              continue
            fi
            path="${path//\\//}"
            if [[ "$path" != tests/* ]]; then
              path="tests/$path"
            fi

            if [[ "$path" == *'*'* ]]; then
              shopt -s nullglob
              expanded_files=($path)
              shopt -u nullglob
              if [ ${#expanded_files[@]} -gt 0 ]; then
                echo "Expanded wildcard pattern '$path' to ${#expanded_files[@]} file(s):"
                for f in "${expanded_files[@]}"; do
                  echo "  -> $f"
                  PYTEST_ARGS+=("$f")
                done
              else
                echo "Warning: No files matched pattern '$path'"
                PYTEST_ARGS+=("$path")
              fi
            else
              PYTEST_ARGS+=("$path")
            fi
          done

          echo "FINAL PYTEST COMMAND: pytest ${PYTEST_ARGS[*]} --alluredir=allure-results"
          pytest "${PYTEST_ARGS[@]}" --alluredir=allure-results

            # ========================================================
      # GENERATE ALLURE REPORT
      # ========================================================

      - name: Generate Allure Report
        if: always()
        shell: bash

        run: |

          mkdir -p allure-results
          mkdir -p allure-report

          if [ "$(ls -A allure-results 2>/dev/null)" ]; then

            echo "Generating Allure Report..."

            allure generate \
              allure-results \
              --clean \
              -o allure-report

          else

            echo "No Allure results found."

            echo "<html><body><h1>No test results found</h1></body></html>" \
              > allure-report/index.html

          fi


      # ========================================================
      # UPLOAD ALLURE REPORT
      # ========================================================

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: "allure-report-${{ github.run_number }}"
          path: allure-report/


      # ========================================================
      # UPLOAD RAW ALLURE RESULTS
      # ========================================================

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: "allure-results-${{ github.run_number }}"
          path: allure-results/
          if-no-files-found: ignore


      # ========================================================
      # SETUP GITHUB PAGES
      # ========================================================

      - name: Setup Pages
        if: always()
        uses: actions/configure-pages@v5


      # ========================================================
      # UPLOAD REPORT TO GITHUB PAGES
      # ========================================================

      - name: Upload Artifact to GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@v3

        with:
          path: allure-report/


      # ========================================================
      # DEPLOY TO GITHUB PAGES
      # ========================================================

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4


      # ========================================================
      # SUMMARY LINK
      # ========================================================
      # SUMMARY TABLE (ALLURE & TRIGGERED MODULES)
      # ========================================================

      - name: Display Test Execution Summary Table
        if: always()
        run: |
          URL="${{ steps.deployment.outputs.page_url }}"
          if [ -z "$URL" ]; then
            URL="https://tensoractai.github.io/playwright-python-framework/"
          fi

          TARGET_PATH="${{ inputs.test_path }}"
          if [ -z "$TARGET_PATH" ] && [ -f "test_execution_path.txt" ]; then
            TARGET_PATH=$(cat test_execution_path.txt)
          fi
          FORMATTED_PATHS=$(echo "$TARGET_PATH" | tr ',' '\n' | sed 's/^[ \t]*//;s/[ \t]*$//' | paste -sd ", " -)

          echo "## 📊 Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Details |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| 📋 **Modules Triggered Name** | \`${{ inputs.test_module }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 📁 **Executed Paths / Files** | \`$FORMATTED_PATHS\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 **Allure Report** | [Open Interactive Allure Report 🔗]($URL) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Click the Allure Report link above to view detailed test logs, steps, and failure screenshots." >> $GITHUB_STEP_SUMMARY


      # ========================================================
      # ENFORCE WORKFLOW FAILURE IF TESTS FAILED
      # ========================================================

      - name: Fail Workflow If Tests Failed
        if: always()
        run: |
          if [ "${{ steps.pytest_step.outcome }}" != "success" ]; then
            echo "❌ Pytest execution encountered test failure(s). Marking workflow job as FAILED."
            exit 1
          fi