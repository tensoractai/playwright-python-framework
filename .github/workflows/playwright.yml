name: Playwright Automation Tests

permissions:
  contents: write
  pages: write
  id-token: write

env:
  ACTIONS_NODE20_DEPRECATION_WARNING: "false"
  GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
  GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
  GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}

on:
  workflow_dispatch:

    inputs:

      # ============================================================
      # 1. MODULE SELECTION
      # ============================================================

      test_module:
        description: "1️⃣ SELECT MODULE"
        required: true
        default: "objectwaysSanity"
        type: choice
        options:
          - objectwaysSanity
          - newCompanySanity
          - AnnotatorReviewer
          - datasets
          - files
          - projects
          - templates
          - users
          - workflows
          - all
          - custom

      # ============================================================
      # 2. CUSTOM TEST PATH
      # ============================================================

      test_path:
        description: "2️⃣ CUSTOM TEST PATH / FILE / PATTERN / MULTIPLE MODULES (Optional)"
        required: false
        default: ""
        type: string

      # ============================================================
      # 3. TARGET URL
      # ============================================================

      execution_url:
        description: "3️⃣ TARGET URL"
        required: true
        default: "https://fmn-qa1.tensoract.com"
        type: choice
        options:
          - "https://fmn-qa.tensoract.com/"
          - "https://fmn-qa1.tensoract.com"
          - "https://fmn-staging.tensoract.com/"

      # ============================================================
      # 4. COMPANY ADMIN
      # ============================================================

      company_username:
        description: "4️⃣ COMPANY ADMIN EMAIL"
        required: false
        default: "admin@objectways.com"
        type: string

      company_password:
        description: "5️⃣ COMPANY ADMIN PASSWORD"
        required: false
        default: "Admin123!"
        type: string

      # ============================================================
      # 5. SUPERUSER
      # ============================================================

      superuser_username:
        description: "6️⃣ SUPERUSER EMAIL"
        required: false
        default: "admin@objectways.com"
        type: string

      superuser_password:
        description: "7️⃣ SUPERUSER PASSWORD"
        required: false
        default: "Admin123"
        type: string

      # ============================================================
      # 6. ANNOTATOR 1
      # ============================================================

      annotator1_username:
        description: "8️⃣ ANNOTATOR 1 EMAIL"
        required: false
        default: "annotator1@objectways.com"
        type: string

      annotator1_password:
        description: "9️⃣ ANNOTATOR 1 PASSWORD"
        required: false
        default: "Annotator123!"
        type: string

      # ============================================================
      # 7. ANNOTATOR 2
      # ============================================================

      annotator2_username:
        description: "🔟 ANNOTATOR 2 EMAIL"
        required: false
        default: "annotator2@objectways.com"
        type: string

      annotator2_password:
        description: "1️⃣1️⃣ ANNOTATOR 2 PASSWORD"
        required: false
        default: "Annotator123!"
        type: string

      # ============================================================
      # 8. REVIEWER
      # ============================================================

      reviewer1_username:
        description: "1️⃣2️⃣ REVIEWER 1 EMAIL"
        required: false
        default: "reviewer@objectways.com"
        type: string

      reviewer1_password:
        description: "1️⃣3️⃣ REVIEWER 1 PASSWORD"
        required: false
        default: "Reviewer123!"
        type: string

      # ============================================================
      # 9. OTP
      # ============================================================

      different_email_for_otp:
        description: "1️⃣4️⃣ OTP EMAIL"
        required: false
        default: "worthy58@web-library.net"
        type: string

      different_email_for_otp_password:
        description: "1️⃣5️⃣ OTP EMAIL PASSWORD"
        required: false
        default: "$6y1q=(gLq"
        type: string

      # ============================================================
      # 10. COMPANY NAME
      # ============================================================

      company_name:
        description: "1️⃣6️⃣ COMPANY NAME"
        required: false
        default: "Objectways"
        type: string

      # ============================================================
      # 11. GMAIL OAUTH CREDENTIALS (FOR GMAIL OTP)
      # ============================================================

      gmail_client_id:
        description: "1️⃣7️⃣ GMAIL CLIENT ID (Optional if using GitHub Secrets)"
        required: false
        default:  
        type: string

      gmail_client_secret:
        description: "1️⃣8️⃣ GMAIL CLIENT SECRET (Optional if using GitHub Secrets)"
        required: false
        default: ""
        type: string

      gmail_refresh_token:
        description: "1️⃣9️⃣ GMAIL REFRESH TOKEN (Optional if using GitHub Secrets)"
        required: false
        default: ""
        type: string


jobs:

  playwright-tests:

    name: Playwright Tests

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

          # Cache pip dependencies
          cache: pip
          cache-dependency-path: requirements.txt


      # ============================================================
      # JAVA FOR ALLURE
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # INSTALL ALLURE CLI
      # ============================================================

      - name: Install Allure CLI
        run: |
          npm install -g allure-commandline


      # ============================================================
      # INSTALL PYTHON DEPENDENCIES
      # ============================================================

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium


      # ============================================================
      # CREATE .ENV
      # ============================================================

      - name: Create Environment File
        shell: bash
        run: |

          EXEC_URL="${{ inputs.execution_url }}"

          COMP_USER="${{ inputs.company_username }}"
          COMP_PASS="${{ inputs.company_password }}"

          SUPER_USER="${{ inputs.superuser_username }}"
          SUPER_PASS="${{ inputs.superuser_password }}"

          ANN1_USER="${{ inputs.annotator1_username }}"
          ANN1_PASS="${{ inputs.annotator1_password }}"

          ANN2_USER="${{ inputs.annotator2_username }}"
          ANN2_PASS="${{ inputs.annotator2_password }}"

          REV1_USER="${{ inputs.reviewer1_username }}"
          REV1_PASS="${{ inputs.reviewer1_password }}"

          OTP_EMAIL="${{ inputs.different_email_for_otp }}"
          OTP_PASS="${{ inputs.different_email_for_otp_password }}"

          COMP_NAME="${{ inputs.company_name }}"

          GMAIL_ID="${{ inputs.gmail_client_id || secrets.GMAIL_CLIENT_ID }}"
          GMAIL_SECRET="${{ inputs.gmail_client_secret || secrets.GMAIL_CLIENT_SECRET }}"
          GMAIL_REFRESH="${{ inputs.gmail_refresh_token || secrets.GMAIL_REFRESH_TOKEN }}"


          # --------------------------------------------------------
          # NEW COMPANY SANITY
          # --------------------------------------------------------

          if [ "${{ inputs.test_module }}" = "newCompanySanity" ] && [ -n "$SUPER_USER" ]; then

            COMP_USER="$SUPER_USER"
            COMP_PASS="$SUPER_PASS"

          fi


          # --------------------------------------------------------
          # CREATE ENV FILE (No leading whitespace inside EOF)
          # --------------------------------------------------------

          cat <<EOF > .env
QA_url_1="${EXEC_URL}"
QA_url_2="${EXEC_URL}"
QA_url_Staging="${EXEC_URL}"
Execution_url="${EXEC_URL}"
company_Username="${COMP_USER}"
company_Password="${COMP_PASS}"
annotator_Username="${ANN1_USER}"
annotator_Password="${ANN1_PASS}"
annotator_Username_2="${ANN2_USER}"
annotator_Password_2="${ANN2_PASS}"
reviewer_Username="${REV1_USER}"
reviewer_Password="${REV1_PASS}"
different_email_for_otp="${OTP_EMAIL}"
different_email_for_otp_password="${OTP_PASS}"
company_Name="${COMP_NAME}"
GMAIL_CLIENT_ID="${GMAIL_ID}"
GMAIL_CLIENT_SECRET="${GMAIL_SECRET}"
GMAIL_REFRESH_TOKEN="${GMAIL_REFRESH}"
EOF


      # ============================================================
      # DETERMINE TEST PATH
      # ============================================================

      - name: Determine Tests To Run
        shell: bash

        env:
          TEST_MODULE: ${{ inputs.test_module }}
          CUSTOM_PATH: ${{ inputs.test_path }}

        run: |

          echo "=============================================="
          echo "TEST SELECTION"
          echo "=============================================="

          echo "Selected Module : $TEST_MODULE"
          echo "Custom Path     : $CUSTOM_PATH"

          echo "=============================================="


          # --------------------------------------------------------
          # CUSTOM PATH PROVIDED
          # --------------------------------------------------------

          if [ -n "$CUSTOM_PATH" ]; then

            echo "Custom test path provided."

            # Convert Windows paths to Linux paths
            CUSTOM_PATH="${CUSTOM_PATH//\\//}"

            echo "Normalized path:"
            echo "$CUSTOM_PATH"

            echo "$CUSTOM_PATH" > test_execution_path.txt


          # --------------------------------------------------------
          # ALL
          # --------------------------------------------------------

          elif [ "$TEST_MODULE" = "all" ]; then

            echo "Running ALL test modules."

            echo "tests" > test_execution_path.txt


          # --------------------------------------------------------
          # NORMAL MODULE
          # --------------------------------------------------------

          else

            echo "Running selected module."

            echo "tests/$TEST_MODULE" > test_execution_path.txt

          fi


          echo ""
          echo "Final Test Selection:"
          cat test_execution_path.txt

          echo "=============================================="


      # ============================================================
      # RUN PLAYWRIGHT TESTS
      # ============================================================

      - name: Run Playwright Tests
        continue-on-error: true
        shell: bash

        env:
          HEADLESS: "true"
          GMAIL_CLIENT_ID: ${{ inputs.gmail_client_id || secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ inputs.gmail_client_secret || secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ inputs.gmail_refresh_token || secrets.GMAIL_REFRESH_TOKEN }}

        run: |

          mkdir -p allure-results

          TEST_SELECTION=$(cat test_execution_path.txt)

          echo "=============================================="
          echo "RUNNING TESTS"
          echo "=============================================="

          echo "Test Selection:"
          echo "$TEST_SELECTION"

          echo "=============================================="


          # --------------------------------------------------------
          # Split multiple paths by comma
          # --------------------------------------------------------

          IFS=',' read -ra TEST_PATHS <<< "$TEST_SELECTION"


          PYTEST_ARGS=()


          for path in "${TEST_PATHS[@]}"; do

            # Remove spaces
            path=$(echo "$path" | xargs)

            # Skip empty path
            if [ -z "$path" ]; then
              continue
            fi

            # Convert Windows path
            path="${path//\\//}"


            # ------------------------------------------------------
            # If user entered only module name
            #
            # datasets
            #
            # becomes
            #
            # tests/datasets
            # ------------------------------------------------------

            if [[ "$path" != tests/* ]]; then

              path="tests/$path"

            fi


            echo "Adding:"
            echo "$path"

            PYTEST_ARGS+=("$path")

          done


          # --------------------------------------------------------
          # Show final command
          # --------------------------------------------------------

          echo ""
          echo "=============================================="
          echo "FINAL PYTEST COMMAND"
          echo "=============================================="

          printf 'pytest '

          for arg in "${PYTEST_ARGS[@]}"; do
            printf '"%s" ' "$arg"
          done

          echo "--alluredir=allure-results"

          echo "=============================================="


          # --------------------------------------------------------
          # Execute
          # --------------------------------------------------------

          pytest "${PYTEST_ARGS[@]}" --alluredir=allure-results


      # ============================================================
      # GENERATE ALLURE REPORT
      # ============================================================

      - name: Generate Allure Report
        if: always()

        run: |

          mkdir -p allure-results allure-report

          if [ "$(ls -A allure-results 2>/dev/null)" ]; then

            echo "Generating Allure Report..."

            allure generate \
              allure-results \
              --clean \
              -o allure-report

          else

            echo "No Allure results found. Creating empty report index..."

            echo "<html><body><h1>No test results found</h1></body></html>" > allure-report/index.html

          fi


      # ============================================================
      # UPLOAD ALLURE REPORT
      # ============================================================

      - name: Upload Allure Report
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: allure-report-${{ github.run_number }}

          path: allure-report/


      # ============================================================
      # UPLOAD RAW ALLURE RESULTS
      # ============================================================

      - name: Upload Allure Results
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: allure-results-${{ github.run_number }}

          path: allure-results/

          if-no-files-found: ignore


      # ============================================================
      # DEPLOY ALLURE REPORT TO GITHUB PAGES
      # ============================================================

      - name: Setup Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload Artifact to GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report/

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4