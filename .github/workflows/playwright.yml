name: Playwright Automation Tests (Jenkins-Style Dispatch)

on:
  workflow_dispatch:
    inputs:
      test_suite:
        description: "Select Test Suite / Folder to execute"
        required: true
        default: "objectwaysSanity"
        type: choice
        options:
          - "objectwaysSanity"
          - "newCompanySanity"
          - "AnnotatorReviewer"
          - "datasets"
          - "files"
          - "projects"
          - "templates"
          - "users"
          - "workflows"
          - "all"

      execution_url:
        description: "Target Execution URL"
        required: true
        default: "https://fmn-qa1.tensoract.com"
        type: string

      # Credentials for ObjectwaysSanity & Other folders
      company_username:
        description: "Company Admin Username (Email) [ObjectwaysSanity / Other Folders]"
        required: false
        default: "admin@liceum.ai"
        type: string

      company_password:
        description: "Company Admin Password [ObjectwaysSanity / Other Folders]"
        required: false
        default: "Admin123!"
        type: string

      # Annotator 1 Credentials (for ObjectwaysSanity)
      annotator1_username:
        description: "Annotator 1 Username (Email) [ObjectwaysSanity]"
        required: false
        default: "annotator1@objectways.com"
        type: string

      annotator1_password:
        description: "Annotator 1 Password [ObjectwaysSanity]"
        required: false
        default: "Annotator123!"
        type: string

      # Annotator 2 Credentials (for ObjectwaysSanity)
      annotator2_username:
        description: "Annotator 2 Email/Username [ObjectwaysSanity]"
        required: false
        default: "annotator2@objectways.com"
        type: string

      annotator2_password:
        description: "Annotator 2 Password [ObjectwaysSanity]"
        required: false
        default: "Annotator123!"
        type: string

      # Reviewer 1 Credentials (for ObjectwaysSanity)
      reviewer1_username:
        description: "Reviewer 1 Username (Email) [ObjectwaysSanity]"
        required: false
        default: "reviewer@objectways.com"
        type: string

      reviewer1_password:
        description: "Reviewer 1 Password [ObjectwaysSanity]"
        required: false
        default: "Reviewer123!"
        type: string

      # Superuser Credentials (for newCompanySanity)
      superuser_username:
        description: "Superuser Username (Email) [newCompanySanity]"
        required: false
        default: ""
        type: string

      superuser_password:
        description: "Superuser Password [newCompanySanity]"
        required: false
        default: ""
        type: string

      # OTP & Company Meta Data
      different_email_for_otp:
        description: "OTP Email (different_email_for_otp)"
        required: false
        default: "worthy58@web-library.net"
        type: string

      different_email_for_otp_password:
        description: "OTP Email Password"
        required: false
        default: "$6y1q=(gLq"
        type: string

      company_name:
        description: "Company Name"
        required: false
        default: "Objectways"
        type: string

jobs:
  playwright-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java (for Allure Report CLI)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Allure CLI
        run: |
          npm install -g allure-commandline --save-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Create Environment File (.env)
        shell: bash
        run: |
          EXEC_URL="${{ inputs.execution_url }}"
          COMP_USER="${{ inputs.company_username }}"
          COMP_PASS="${{ inputs.company_password }}"
          SUPER_USER="${{ inputs.superuser_username }}"
          SUPER_PASS="${{ inputs.superuser_password }}"

          # If newCompanySanity selected & superuser username provided, override company admin credentials
          if [ "${{ inputs.test_suite }}" = "newCompanySanity" ] && [ -n "$SUPER_USER" ]; then
            COMP_USER="$SUPER_USER"
            COMP_PASS="$SUPER_PASS"
          fi

          cat <<EOF > .env
          QA_url_1="${EXEC_URL}"
          QA_url_2="${EXEC_URL}"
          QA_url_Staging="${EXEC_URL}"
          Execution_url="${EXEC_URL}"
          different_email_for_otp="${{ inputs.different_email_for_otp }}"
          different_email_for_otp_password="${{ inputs.different_email_for_otp_password }}"
          company_Username="${COMP_USER}"
          company_Password="${COMP_PASS}"
          annotator_Username="${{ inputs.annotator1_username }}"
          annotator_Password="${{ inputs.annotator1_password }}"
          annotator_Username_2="${{ inputs.annotator2_username }}"
          annotator_Password_2="${{ inputs.annotator2_password }}"
          reviewer_Username="${{ inputs.reviewer1_username }}"
          reviewer_Password="${{ inputs.reviewer1_password }}"
          company_Name="${{ inputs.company_name }}"
          EOF

      - name: Run Playwright Tests
        shell: bash
        env:
          HEADLESS: "true"
        run: |
          if [ "${{ inputs.test_suite }}" = "all" ]; then
            pytest tests/ --alluredir=allure-results
          else
            pytest "tests/${{ inputs.test_suite }}" --alluredir=allure-results
          fi

      - name: Generate Allure Report
        if: always()
        run: |
          allure generate allure-results --clean -o allure-report

      - name: Upload Allure Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ inputs.test_suite }}
          path: allure-report/