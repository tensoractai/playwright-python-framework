name: Playwright Automation Tests

permissions:
  contents: write
  pages: write
  id-token: write

env:
  ACTIONS_NODE20_DEPRECATION_WARNING: "false"
  GMAIL_CLIENT_ID: "${{ secrets.GMAIL_CLIENT_ID }}"
  GMAIL_CLIENT_SECRET: "${{ secrets.GMAIL_CLIENT_SECRET }}"
  GMAIL_REFRESH_TOKEN: "${{ secrets.GMAIL_REFRESH_TOKEN }}"
  different_email_for_otp: "${{ secrets.different_email_for_otp }}"

on:
  workflow_dispatch:
    inputs:

      # ============================================================
      # 1. MODULE SELECTION
      # ============================================================

      test_module:
        description: "1️⃣ SELECT MODULE"
        required: true
        default: "objectwaysSanity"
        type: choice
        options:
          - objectwaysSanity
          - newCompanySanity
          - AnnotatorReviewer
          - datasets
          - files
          - projects
          - templates
          - users
          - workflows
          - all
          - custom

      # ============================================================
      # 2. CUSTOM TEST PATH
      # ============================================================

      test_path:
        description: "2️⃣ CUSTOM TEST PATH / FILE / PATTERN / MULTIPLE MODULES (Optional)"
        required: false
        default: ""
        type: string

      # ============================================================
      # 3. TARGET URL
      # ============================================================

      execution_url:
        description: "3️⃣ TARGET URL"
        required: true
        default: "https://fmn-qa1.tensoract.com"
        type: choice
        options:
          - "https://fmn-qa.tensoract.com/"
          - "https://fmn-qa1.tensoract.com"
          - "https://fmn-staging.tensoract.com/"

      # ============================================================
      # 4. COMPANY ADMIN
      # ============================================================

      company_username:
        description: "4️⃣ COMPANY ADMIN EMAIL"
        required: false
        default: "admin@objectways.com"
        type: string

      company_password:
        description: "5️⃣ COMPANY ADMIN PASSWORD"
        required: false
        default: "Admin123!"
        type: string

      # ============================================================
      # 5. SUPERUSER
      # ============================================================

      superuser_username:
        description: "6️⃣ SUPERUSER EMAIL"
        required: false
        default: "admin@objectways.com"
        type: string

      superuser_password:
        description: "7️⃣ SUPERUSER PASSWORD"
        required: false
        default: "Admin123"
        type: string

      # ============================================================
      # 6. ANNOTATOR 1
      # ============================================================

      annotator1_username:
        description: "8️⃣ ANNOTATOR 1 EMAIL"
        required: false
        default: "annotator1@objectways.com"
        type: string

      annotator1_password:
        description: "9️⃣ ANNOTATOR 1 PASSWORD"
        required: false
        default: "Annotator123!"
        type: string

      # ============================================================
      # 7. ANNOTATOR 2
      # ============================================================

      annotator2_username:
        description: "🔟 ANNOTATOR 2 EMAIL"
        required: false
        default: "annotator2@objectways.com"
        type: string

      annotator2_password:
        description: "1️⃣1️⃣ ANNOTATOR 2 PASSWORD"
        required: false
        default: "Annotator123!"
        type: string

      # ============================================================
      # 8. REVIEWER
      # ============================================================

      reviewer1_username:
        description: "1️⃣2️⃣ REVIEWER 1 EMAIL"
        required: false
        default: "reviewer@objectways.com"
        type: string

      reviewer1_password:
        description: "1️⃣3️⃣ REVIEWER 1 PASSWORD"
        required: false
        default: "Reviewer123!"
        type: string

      # ============================================================
      # 9. OTP
      # ============================================================

      different_email_for_otp:
        description: "1️⃣4️⃣ OTP EMAIL"
        required: false
        default: ""
        type: string

      # ============================================================
      # 10. COMPANY NAME
      # ============================================================

      company_name:
        description: "1️⃣6️⃣ COMPANY NAME"
        required: false
        default: "Objectways"
        type: string


jobs:

  playwright-tests:

    name: Playwright Tests

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT REPOSITORY
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # SETUP PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # ============================================================
      # SETUP JAVA FOR ALLURE
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # INSTALL ALLURE CLI
      # ============================================================

      - name: Install Allure CLI
        run: |
          npm install -g allure-commandline

      # ============================================================
      # INSTALL PYTHON DEPENDENCIES
      # ============================================================

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # ============================================================
      # CREATE .ENV FILE
      # ============================================================

      - name: Create Environment File
        shell: bash
        env:
          GMAIL_CLIENT_ID: "${{ secrets.GMAIL_CLIENT_ID }}"
          GMAIL_CLIENT_SECRET: "${{ secrets.GMAIL_CLIENT_SECRET }}"
          GMAIL_REFRESH_TOKEN: "${{ secrets.GMAIL_REFRESH_TOKEN }}"
          different_email_for_otp: "${{ secrets.different_email_for_otp }}"
        run: |

          EXEC_URL="${{ inputs.execution_url }}"

          COMP_USER="${{ inputs.company_username }}"
          COMP_PASS="${{ inputs.company_password }}"

          SUPER_USER="${{ inputs.superuser_username }}"
          SUPER_PASS="${{ inputs.superuser_password }}"

          ANN1_USER="${{ inputs.annotator1_username }}"
          ANN1_PASS="${{ inputs.annotator1_password }}"

          ANN2_USER="${{ inputs.annotator2_username }}"
          ANN2_PASS="${{ inputs.annotator2_password }}"

          REV1_USER="${{ inputs.reviewer1_username }}"
          REV1_PASS="${{ inputs.reviewer1_password }}"

          COMP_NAME="${{ inputs.company_name }}"

          GMAIL_ID="${GMAIL_CLIENT_ID}"
          GMAIL_SECRET="${GMAIL_CLIENT_SECRET}"
          GMAIL_REFRESH="${GMAIL_REFRESH_TOKEN}"
          different_email_for_otp="${different_email_for_otp}"

          if [ "${{ inputs.test_module }}" = "newCompanySanity" ] && [ -n "$SUPER_USER" ]; then
            COMP_USER="$SUPER_USER"
            COMP_PASS="$SUPER_PASS"
          fi

          cat << EOF | sed 's/^[ \t]*//' > .env
          QA_url_1="${EXEC_URL}"
          QA_url_2="${EXEC_URL}"
          QA_url_Staging="${EXEC_URL}"
          Execution_url="${EXEC_URL}"

          company_Username="${COMP_USER}"
          company_Password="${COMP_PASS}"

          annotator_Username="${ANN1_USER}"
          annotator_Password="${ANN1_PASS}"

          annotator_Username_2="${ANN2_USER}"
          annotator_Password_2="${ANN2_PASS}"

          reviewer_Username="${REV1_USER}"
          reviewer_Password="${REV1_PASS}"

          company_Name="${COMP_NAME}"

          GMAIL_CLIENT_ID="${GMAIL_ID}"
          GMAIL_CLIENT_SECRET="${GMAIL_SECRET}"
          GMAIL_REFRESH_TOKEN="${GMAIL_REFRESH}"
          different_email_for_otp="${different_email_for_otp}"
          EOF

          echo "Environment file created successfully."

      # ============================================================
      # DETERMINE TEST PATH
      # ============================================================

      - name: Determine Tests To Run
        shell: bash
        env:
          TEST_MODULE: ${{ inputs.test_module }}
          CUSTOM_PATH: ${{ inputs.test_path }}
        run: |

          echo "=============================================="
          echo "TEST SELECTION"
          echo "=============================================="
          echo "Selected Module : $TEST_MODULE"
          echo "Custom Path     : $CUSTOM_PATH"
          echo "=============================================="

          if [ -n "$CUSTOM_PATH" ]; then
            echo "Custom test path provided."
            CUSTOM_PATH="${CUSTOM_PATH//\\//}"
            echo "$CUSTOM_PATH" > test_execution_path.txt
          elif [ "$TEST_MODULE" = "all" ]; then
            echo "Running ALL test modules."
            echo "tests" > test_execution_path.txt
          else
            echo "Running selected module."
            echo "tests/$TEST_MODULE" > test_execution_path.txt
          fi

          echo "Final Test Selection:"
          cat test_execution_path.txt
          echo "=============================================="

      # ============================================================
      # RUN PLAYWRIGHT TESTS
      # ============================================================

      - name: Run Playwright Tests
        continue-on-error: true
        shell: bash
        env:
          HEADLESS: "true"
          GMAIL_CLIENT_ID: "${{ secrets.GMAIL_CLIENT_ID }}"
          GMAIL_CLIENT_SECRET: "${{ secrets.GMAIL_CLIENT_SECRET }}"
          GMAIL_REFRESH_TOKEN: "${{ secrets.GMAIL_REFRESH_TOKEN }}"
          different_email_for_otp: "${{ secrets.different_email_for_otp }}"
        run: |

          mkdir -p allure-results

          TEST_SELECTION=$(cat test_execution_path.txt)

          echo "=============================================="
          echo "RUNNING TESTS"
          echo "=============================================="
          echo "Test Selection: $TEST_SELECTION"
          echo "=============================================="

          IFS=',' read -ra TEST_PATHS <<< "$TEST_SELECTION"
          PYTEST_ARGS=()

          for path in "${TEST_PATHS[@]}"; do
            path=$(echo "$path" | xargs)
            if [ -z "$path" ]; then
              continue
            fi
            path="${path//\\//}"
            if [[ "$path" != tests/* ]]; then
              path="tests/$path"
            fi
            PYTEST_ARGS+=("$path")
          done

          echo "FINAL PYTEST COMMAND: pytest ${PYTEST_ARGS[*]} --alluredir=allure-results"
          pytest "${PYTEST_ARGS[@]}" --alluredir=allure-results

      # ============================================================
      # GENERATE ALLURE REPORT
      # ============================================================

      - name: Generate Allure Report
        if: always()
        shell: bash
        run: |

          mkdir -p allure-results allure-report

          if [ "$(ls -A allure-results 2>/dev/null)" ]; then
            echo "Generating Allure Report..."
            allure generate allure-results --clean -o allure-report
          else
            echo "No Allure results found."
            echo "<html><body><h1>No test results found</h1></body></html>" > allure-report/index.html
          fi

      # ============================================================
      # UPLOAD ALLURE REPORT
      # ============================================================

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "allure-report-${{ github.run_number }}"
          path: allure-report/

      # ============================================================
      # UPLOAD RAW ALLURE RESULTS
      # ============================================================

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "allure-results-${{ github.run_number }}"
          path: allure-results/
          if-no-files-found: ignore

      # ============================================================
      # DEPLOY ALLURE REPORT TO GITHUB PAGES
      # ============================================================

      - name: Setup Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload Artifact to GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report/

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4